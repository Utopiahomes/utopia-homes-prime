name: CI

on:
  push:
  pull_request:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    services:
      postgres:  # the business core's Postgres store test
        image: postgres:16
        env:
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: utopia_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      UTOPIA_TEST_DATABASE_URL: postgresql://postgres:ci@localhost:5432/utopia_test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install package with dev dependencies
        run: pip install -e ".[dev]"

      - name: Lint (ruff)
        run: ruff check .

      - name: Type-check (mypy)
        run: mypy src

      - name: Verify vendored conformance bundle is untouched
        run: |
          python contracts/stoin-business-guest-answer-v1-bundle/tools/compute_digest.py --check
          python contracts/stoin-business-guest-answer-v1-bundle/tools/verify_bundle.py

      - name: Verify vendored Management Contract bundle is untouched
        run: |
          python contracts/stoin-management-v1-bundle/tools/compute_digest.py --check
          python contracts/stoin-management-v1-bundle/tools/verify_bundle.py

      - name: Verify pinned Shared Model Execution RC1 freeze package
        run: python contracts/stoin-shared-model-execution-v1-rc1/verify_pin.py

      - name: Unit + integration tests
        run: pytest -m "not contract" tests/unit tests/integration tests/management

      - name: Contract tests (real two-process network HTTP)
        run: pytest -m contract tests/contract tests/management/contract
