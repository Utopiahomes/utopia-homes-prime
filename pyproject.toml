[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "utopia-homes-prime"
version = "0.1.0"
description = "Utopia Homes Prime: the Homes business synth (guest.answer, Homes Dragon meeting operations, Homes-selected inference)."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.116,<1",
    "pydantic>=2.11,<3",
    "uvicorn[standard]>=0.35,<1",
    "pyjwt[crypto]>=2.9,<3",
    "httpx>=0.27,<1",
    "rfc8785==0.1.4",
]

[project.optional-dependencies]
dev = [
    "jsonschema>=4.23",
    "referencing>=0.35",
    "mypy>=1.11",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "ruff>=0.6",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
pythonpath = ["tests"]
asyncio_mode = "auto"
markers = [
    "contract: real-network two-process contract tests (slower; spawns subprocesses)",
]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["contracts/"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["utopia_homes_prime"]
mypy_path = "src"

[[tool.mypy.overrides]]
module = ["check_invariants_impl", "jsonschema.*", "referencing.*", "rfc8785.*"]
ignore_missing_imports = true
